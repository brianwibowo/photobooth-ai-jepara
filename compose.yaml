name: photobooth-jepara

services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8787"
      # QR links must be the externally reachable URL (including :8443 here).
      # Keep this in sync with HTTPS_PORT and any upstream reverse proxy.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://photobooth-jepara.duckdns.org:8443}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-nano-banana-2.1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-${AI_INFOGRAPHIC_MODEL:-openai/gpt-image-2.5-flare}}
      AI_INFOGRAPHIC_MODEL: ${AI_INFOGRAPHIC_MODEL:-}
      ALLOW_LOCAL_FALLBACK: ${ALLOW_LOCAL_FALLBACK:-false}
      # QR/download token lifetime (milliseconds). Generated files remain for
      # RESULT_RETENTION_MS and are independent from this short token TTL.
      DOWNLOAD_TTL_MS: ${DOWNLOAD_TTL_MS:-60000}
      # Set to 0 to keep generated PNGs/DB records until manual cleanup.
      RESULT_RETENTION_MS: ${RESULT_RETENTION_MS:-604800000}
      # Optional museum export endpoint; keep the token only in the VPS .env.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Museum R.A. Kartini}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-200}
      MAX_UPLOAD_MB: "8"
      NODE_OPTIONS: --max-old-space-size=512
      MALLOC_ARENA_MAX: "2"
      TZ: Asia/Jakarta
    volumes:
      - photobooth_data:/app/data
    # No host port: the backend is only reached through Caddy.
    expose:
      - "8787"
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health', {signal: AbortSignal.timeout(4000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    build:
      context: .
      target: caddy-runtime
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-photobooth-jepara.duckdns.org}
      # The host port is not visible inside the container. Caddy needs it to
      # emit a redirect that reaches this stack instead of the service on 443.
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-8443}
      DUCKDNS_API_TOKEN: ${DUCKDNS_API_TOKEN:?Isi DUCKDNS_API_TOKEN dari DuckDNS di .env}
    ports:
      # Ports 80/443 belong to another VPS service. Use HTTPS on 8443 with DNS-01.
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  photobooth_data:
  caddy_data:
  caddy_config:
